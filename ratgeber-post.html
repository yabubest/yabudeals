<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Ratgeber – YabuDeals</title>
 <meta name="description" content="Produkttests, Tipps und Ratgeber von YabuDeals.">
 <link rel="stylesheet" href="/style.css">
</head>
<body>

 <!-- GLOBALE KOPFZEILE -->
 <div id="global-header"></div>

 <div class="blog-post-container">
 <a href="/blog.html" class="back-link">&larr; Zurück zum Blog</a>
 <div id="postContainer">
 <div class="no-deals">Lade Beitrag...</div>
 </div>
 </div>

 <!-- GLOBALE FUSSZEILE -->
 <div id="global-footer"></div>

 <script src="/components.js"></script>
 <script>
 const params = new URLSearchParams(window.location.search);
 const postSlug = params.get('post');

 async function loadPost() {
 const container = document.getElementById('postContainer');

 if (!postSlug) {
 container.innerHTML = '<p class="no-deals">Kein Beitrag angegeben.</p>';
 return;
 }

 try {
 const res = await fetch('/blog-posts.json');
 if (!res.ok) throw new Error('HTTP ' + res.status);
 const posts = await res.json();

 const post = posts.find(p => (p['Link'] || '') === postSlug);

 if (!post) {
 container.innerHTML = '<p class="no-deals">Dieser Beitrag wurde nicht gefunden.</p>';
 return;
 }

 // Suche den passenden Affiliate-Link
 const affiliateLink = await findAffiliateLink(post);
 renderPost(post, affiliateLink);
 } catch (error) {
 console.error(error);
 container.innerHTML = '<p class="no-deals">Beitrag konnte nicht geladen werden.</p>';
 }
 }

 async function findAffiliateLink(post) {
 // 1. Direkt aus dem Blog-Post lesen (falls vorhanden)
 if (post['Affiliate Link'] && post['Affiliate Link'] !== '#') return post['Affiliate Link'];
 if (post['Link_Deal'] && post['Link_Deal'] !== '#') return post['Link_Deal'];

 const title = (post['Titel'] || '').toLowerCase();

 try {
 // 2. Durchsuche deals.json & aliexpress-deals.json nach passendem Produkt
 const [resAmz, resAli] = await Promise.allSettled([
 fetch('/deals.json').then(r => r.ok ? r.json() : []),
 fetch('/aliexpress-deals.json').then(r => r.ok ? r.json() : [])
 ]);

 const amazonDeals = resAmz.status === 'fulfilled' ? resAmz.value : [];
 const aliDeals = resAli.status === 'fulfilled' ? resAli.value : [];
 const allDeals = [...amazonDeals, ...aliDeals];

 // Vergleiche Bild-URL oder Schlüsselwörter im Titel
 const matchedDeal = allDeals.find(deal => {
 const dealImg = (deal['Bild-URL (Optional)'] || deal['Bild-URL'] || '').trim();
 const postImg = (post['Bild-URL'] || '').trim();
 if (dealImg && postImg && dealImg === postImg) return true;

 const dealTitle = (deal['Produkt-Titel'] || '').toLowerCase();
 return title.split(' ').some(word => word.length > 4 && dealTitle.includes(word));
 });

 if (matchedDeal) {
 return matchedDeal['Link: ybbst-21'] || matchedDeal['Affiliate Link'] || matchedDeal['Link'] || '#';
 }
 } catch (e) {
 console.error("Fehler beim Suchen des Affiliate Links:", e);
 }

 // 3. Fallback: Amazon Suche mit Partner-Tag ybbst-21
 return `https://www.amazon.de/s?k=${encodeURIComponent(post['Titel'] || '')}&tag=ybbst-21`;
 }

 function renderPost(post, affiliateLink) {
 const container = document.getElementById('postContainer');

 const title = post['Titel'] || 'Blogbeitrag';
 const image = post['Bild-URL'] || '';
 const category = post['Kategorie'] || 'Ratgeber';
 const date = post['Datum'] || '';
 const readTime = post['Lesezeit'] ? ` • ⏱️ ${post['Lesezeit']}` : '';
 const contentHtml = post['Content_HTML'] || `<p>${post['Auszug'] || ''}</p>`;

 document.title = `${title} – YabuDeals`;

 container.innerHTML = `
 ${image ? `<div class="blog-hero-wrapper"><img src="${image}" alt="${title}" class="blog-post-hero-img"></div>` : ''}
 <div class="blog-post-meta">${category}${readTime}${date ? ` • ${date}` : ''}</div>
 <h1 class="blog-post-title">${title}</h1>
 <div class="blog-post-content">${contentHtml}</div>

 <!-- 🎯 CTA-BOX MIT DIREKTEM PRODUKT-LINK -->
 <div class="blog-cta-box">
 <h3>Gefällt dir dieses Produkt?</h3>
 <p>Entdecke jetzt das passende Schnäppchen und sichere dir den besten Preis!</p>
 <a href="${affiliateLink}" target="_blank" rel="nofollow noopener sponsored" class="blog-cta-btn">
 👉 Jetzt Angebot ansehen & sparen &rarr;
 </a>
 </div>
 `;
 }

 loadPost();
 </script>
</body>
</html>
