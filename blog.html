<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog & Ratgeber – YabuDeals</title>
  <meta name="description" content="Nützliche Ratgeber, Tests und Kauftipps zu den besten Angeboten auf YabuDeals.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- GLOBALE KOPFZEILE -->
  <div id="global-header"></div>

  <div style="flex: 1;">
    <div class="hero">
      <h1>Blog & Ratgeber</h1>
      <p>Tipps, Produkttests und Empfehlungen rund um die besten Deals.</p>
    </div>

    <div class="blog-post-container">
      <div id="blogGrid" class="deals-grid">
        <div class="no-deals">Lade Beiträge...</div>
      </div>
    </div>
  </div>

  <!-- GLOBALE FUSSZEILE -->
  <div id="global-footer"></div>

  <script src="/components.js"></script>
  <script>
    async function loadBlogPosts() {
      const grid = document.getElementById('blogGrid');
      try {
        const res = await fetch('/blog-posts.json?v=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const posts = await res.json();

        if (!posts || posts.length === 0) {
          grid.innerHTML = '<div class="no-deals">Aktuell sind keine Blogbeiträge vorhanden.</div>';
          return;
        }

        grid.innerHTML = posts.map(post => {
          const title = post['Titel'] || 'Ratgeber-Beitrag';
          const image = post['Bild-URL'] || 'https://via.placeholder.com/300x200';
          const category = post['Kategorie'] || 'Ratgeber';
          const excerpt = post['Auszug'] || '';
          const link = post['Link'] ? `/ratgeber-post.html?post=${encodeURIComponent(post['Link'])}` : '#';

          return `
            <div class="deal-card">
              <a href="${link}" style="text-decoration:none; color:inherit;">
                <div class="img-container">
                  <img src="${image}" alt="${title}" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x200';">
                </div>
                <div class="category-tag">${category}</div>
                <div class="deal-title" style="height:auto; min-height:2.6em;">${title}</div>
                <p style="font-size:0.8rem; color:var(--text-muted); line-height:1.4; margin:8px 0 14px; display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">${excerpt}</p>
              </a>
              <a href="${link}" class="btn-buy-amazon" style="background:var(--primary); color:#ffffff; border-color:var(--primary);">Beitrag lesen &rarr;</a>
            </div>
          `;
        }).join('');

      } catch (e) {
        console.error(e);
        grid.innerHTML = '<div class="no-deals">Beiträge konnten nicht geladen werden.</div>';
      }
    }

    loadBlogPosts();
  </script>
</body>
</html>
