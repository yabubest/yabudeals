<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YabuDeals – Beste Deals & Rabatte entdecken</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gray: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --badge-red: #ef4444;
            --badge-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            margin-left: 15px;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        .hero {
            text-align: center;
            padding: 40px 20px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
        }

        .search-container {
            max-width: 1000px;
            margin: 20px auto 30px;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-container input, .search-container select {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: var(--card-bg);
        }

        .search-container input {
            flex: 1;
            min-width: 250px;
        }

        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .deal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .deal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .badge-discount {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--badge-red);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .category-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .deal-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 15px;
        }

        .offer-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .regular-price {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .btn-buy {
            display: block;
            width: 100%;
            text-align: center;
            background: #ffd814;
            color: #0f1111;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #fcd200;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background: #f7ca00;
        }

        .no-deals {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">🚀 YabuDeals</a>
        <nav>
            <a href="/" class="active">Startseite</a>
            <a href="/blog.html">Blog & Ratgeber</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Beste Deals & Rabatte entdecken</h1>
        <p>Automatisch aktualisierte Top-Angebote direkt aus unserer Community.</p>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Produkt suchen (z.B. Hülle, Stuhl, Teppich)..." onkeyup="filterDeals()">
        <select id="categoryFilter" onchange="filterDeals()">
            <option value="">Alle Kategorien</option>
        </select>
    </div>

    <div class="deals-grid" id="dealsContainer">
        <div class="no-deals">Lade aktuelle Deals...</div>
    </div>

    <script>
        let allDeals = [];

        // Deals aus der von n8n generierten deals.json laden
        async function fetchDeals() {
            try {
                const response = await fetch('deals.json');
                if (!response.ok) throw new Error('Netzwerk-Fehler beim Laden der deals.json');
                
                allDeals = await response.json();
                populateCategories();
                renderDeals(allDeals);
            } catch (error) {
                console.error('Fehler:', error);
                document.getElementById('dealsContainer').innerHTML = 
                    '<div class="no-deals">Aktuell sind keine Deals erreichbar. Bitte später erneut versuchen.</div>';
            }
        }

        // Dynamisch Kategorien für das Filter-Menü erstellen
        function populateCategories() {
            const categories = new Set();
            allDeals.forEach(deal => {
                const cat = deal['Kategorie'] || deal.category;
                if (cat) categories.add(cat);
            });

            const select = document.getElementById('categoryFilter');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        // Deals auf der Seite rendern
        function renderDeals(deals) {
            const container = document.getElementById('dealsContainer');
            if (!deals || deals.length === 0) {
                container.innerHTML = '<div class="no-deals">Keine passenden Deals gefunden.</div>';
                return;
            }

            container.innerHTML = deals.map(deal => {
                const title = deal['Produkt-Titel'] || deal.title || deal.kurzTitel || 'Amazon Angebot';
                const image = deal['Bild-URL (Optional)'] || deal.image || 'https://via.placeholder.com/250';
                const offerPrice = deal['Angebotspreis (€)'] || deal.offerPrice || 'N/A';
                const regPrice = deal['Regulärer Preis (€)'] || deal.regularPrice || '';
                const discount = deal['Rabatt (z.B. 30% Rabatt)'] || deal.discount || '';
                const category = deal['Kategorie'] || deal.category || 'Deal';
                
                // Nutzt den ersten verfügbaren Affiliate-Link
                const link = deal['Link: ybbst-21'] || deal.link_ybbst || deal['Link: yabubestshop00-21'] || '#';

                return `
                    <div class="deal-card">
                        ${discount ? `<div class="badge-discount">${discount}</div>` : ''}
                        <div class="img-container">
                            <img src="${image}" alt="${title}" loading="lazy">
                        </div>
                        <div class="category-tag">${category}</div>
                        <div class="deal-title" title="${title}">${title}</div>
                        <div class="price-row">
                            <span class="offer-price">${offerPrice}</span>
                            ${regPrice ? `<span class="regular-price">statt ${regPrice}</span>` : ''}
                        </div>
                        <a href="${link}" target="_blank" rel="nofollow" class="btn-buy">Zum Angebot &rarr;</a>
                    </div>
                `;
            }).join('');
        }

        // Such- & Filterfunktion
        function filterDeals() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filtered = allDeals.filter(deal => {
                const title = (deal['Produkt-Titel'] || deal.title || '').toLowerCase();
                const category = deal['Kategorie'] || deal.category || '';
                
                const matchesSearch = title.includes(searchTerm);
                const matchesCategory = selectedCategory === '' || category === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            renderDeals(filtered);
        }

        // Beim Laden der Seite ausführen
        fetchDeals();
    </script>
</body>
</html>
