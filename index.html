<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YabuDeals – Beste Deals & Rabatte entdecken</title>
    <meta name="description" content="Die besten Amazon- und AliExpress-Angebote im Überblick: täglich aktualisierte Rabatte, Schnäppchen und Deals für Küche, Haushalt, Elektronik, Wellness & mehr.">
    <!-- ABSOLUTER PFAD FÜR CLOUDFLARE CUSTOM DOMAIN -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- GLOBALE KOPFZEILE -->
    <div id="global-header"></div>

    <div style="flex: 1;">
        <!-- HERO -->
        <div class="hero">
            <h1>Beste Deals & Rabatte entdecken</h1>
            <p>Die besten Schnäppchen von Amazon & AliExpress auf einen Blick.</p>
        </div>

        <!-- FULL-WIDTH FILTERBAR -->
        <div class="filter-section">
            <div class="single-filter-bar">
                <!-- 1. SHOP TABS -->
                <div class="shop-tabs">
                    <button class="shop-tab-btn active" onclick="setShopFilter('all', this)">🛍️ Alle</button>
                    <button class="shop-tab-btn" onclick="setShopFilter('amazon', this)">📦 Amazon</button>
                    <button class="shop-tab-btn" onclick="setShopFilter('ali', this)">🌐 AliExpress</button>
                </div>

                <!-- 2. SUCHFELD -->
                <div class="search-input-wrapper">
                    <input type="text" id="searchInput" placeholder="Produkt suchen (z.B. Hülle, Stuhl)..." onkeyup="onFilterChange()">
                </div>

                <!-- 3. KATEGORIE DROPDOWN -->
                <div class="category-select-wrapper">
                    <select id="categoryFilter" onchange="onFilterChange()">
                        <option value="">Alle Kategorien</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- DEALS GRID (VOLLSCHIRM, 9 SPALTEN DESKTOP) -->
        <div class="deals-grid-container">
            <div class="deals-grid" id="dealsContainer">
                <div class="no-deals">Lade aktuelle Angebote...</div>
            </div>
        </div>

        <!-- PAGINIERUNG (27 DEALS PRO SEITE) -->
        <div class="pagination-container" id="paginationContainer"></div>
    </div>

    <!-- GLOBALE FUSSZEILE -->
    <div id="global-footer"></div>

    <script src="/components.js"></script>
    <script>
        let allDeals = [];
        let filteredDeals = [];
        let currentShop = 'all';
        let selectedCategory = '';

        // EXAKT 27 ANGEBOTE PRO SEITE
        const itemsPerPage = 27;
        let currentPage = 1;

        // Hilfsfunktion: Konvertiert Datums-Strings ("25.07.2026, 09:30:56 Uhr") korrekt in Timestamps
        function parseDate(dateStr) {
            if (!dateStr) return 0;
            try {
                const clean = String(dateStr).replace('Uhr', '').trim();
                const parts = clean.split(',');
                const dateParts = parts[0].trim().split('.');
                const timeParts = parts[1] ? parts[1].trim().split(':') : [0, 0, 0];

                const day = parseInt(dateParts[0], 10);
                const month = parseInt(dateParts[1], 10) - 1;
                const year = parseInt(dateParts[2], 10);
                const hour = parseInt(timeParts[0] || 0, 10);
                const min = parseInt(timeParts[1] || 0, 10);
                const sec = parseInt(timeParts[2] || 0, 10);

                return new Date(year, month, day, hour, min, sec).getTime();
            } catch (e) {
                return 0;
            }
        }

        async function fetchAllDeals() {
            try {
                // Paralleler Abruf beider Quellen mit Cache-Busting (?v=...)
                const [resAmz, resAli] = await Promise.allSettled([
                    fetch('/deals.json?v=' + Date.now()).then(r => r.ok ? r.json() : []),
                    fetch('/aliexpress-deals.json?v=' + Date.now()).then(r => r.ok ? r.json() : [])
                ]);

                const amazonDeals = (resAmz.status === 'fulfilled' ? resAmz.value : []).map(d => ({ ...d, _shop: 'amazon' }));
                const aliDeals = (resAli.status === 'fulfilled' ? resAli.value : []).map(d => ({ ...d, _shop: 'ali' }));

                // Zusammenführen & nach neuestem Datum/Uhrzeit sortieren
                allDeals = [...amazonDeals, ...aliDeals].sort((a, b) => {
                    const timeA = parseDate(a['DATUM'] || a['Datum']);
                    const timeB = parseDate(b['DATUM'] || b['Datum']);
                    return timeB - timeA; // Neueste zuerst!
                });

                populateCategorySelect(document.getElementById('categoryFilter'), allDeals);
                onFilterChange();
            } catch (error) {
                console.error("Fehler beim Laden der Deals:", error);
                document.getElementById('dealsContainer').innerHTML =
                    '<div class="no-deals">Aktuell sind keine Deals erreichbar.</div>';
            }
        }

        function setShopFilter(shop, element) {
            currentShop = shop;
            document.querySelectorAll('.shop-tab-btn').forEach(b => b.classList.remove('active'));
            if (element) element.classList.add('active');
            onFilterChange();
        }

        function onFilterChange() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            selectedCategory = document.getElementById('categoryFilter').value;

            filteredDeals = allDeals.filter(deal => {
                if (currentShop === 'amazon' && deal._shop !== 'amazon') return false;
                if (currentShop === 'ali' && deal._shop !== 'ali') return false;

                const title = (deal['Produkt-Titel'] || deal.title || '').toLowerCase();
                const category = deal['Kategorie'] || deal.category || '';

                const matchesSearch = title.includes(searchTerm);
                const matchesCategory = selectedCategory === '' || category.toLowerCase().includes(selectedCategory.toLowerCase());

                return matchesSearch && matchesCategory;
            });

            currentPage = 1;
            renderCurrentPage();
        }

        function renderCurrentPage() {
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const pageItems = filteredDeals.slice(startIdx, endIdx);

            renderDeals(pageItems);
            renderPaginationHTML(document.getElementById('paginationContainer'), filteredDeals.length, itemsPerPage, currentPage, 'goToPage');
        }

        function renderDeals(deals) {
            const container = document.getElementById('dealsContainer');
            if (!deals || deals.length === 0) {
                container.innerHTML = '<div class="no-deals">Keine passenden Deals gefunden.</div>';
                return;
            }
            container.innerHTML = deals.map(dealCardHTML).join('');
        }

        function goToPage(page) {
            currentPage = page;
            renderCurrentPage();
            
            const filterEl = document.querySelector('.filter-section');
            if (filterEl) {
                filterEl.scrollIntoView({ behavior: 'smooth' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        fetchAllDeals();
    </script>
</body>
</html>
