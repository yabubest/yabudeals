<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YabuDeals – Beste Deals & Rabatte entdecken</title>
  <meta name="description" content="Die besten Schnäppchen von Amazon & AliExpress auf einen Blick. Täglich aktualisierte Angebote.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- GLOBALE KOPFZEILE -->
  <div id="global-header"></div>

  <main style="flex: 1;">
    <!-- HERO SECTION -->
    <div class="hero">
      <h1>Beste Deals & Rabatte entdecken</h1>
      <p>Die besten Schnäppchen von Amazon & AliExpress auf einen Blick.</p>
    </div>

    <!-- FILTER BEREICH -->
    <div class="filter-section">
      <div class="single-filter-bar">
        <div class="shop-tabs">
          <button class="shop-tab-btn active" id="tab-all" onclick="setShopFilter('all')">📁 Alle</button>
          <button class="shop-tab-btn" id="tab-amazon" onclick="setShopFilter('amazon')">📦 Amazon</button>
          <button class="shop-tab-btn" id="tab-ali" onclick="setShopFilter('ali')">🌐 AliExpress</button>
        </div>

        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Produkt suchen (z.B. Hülle, Stuhl)..." onkeyup="onFilterChange()">
        </div>

        <div class="category-select-wrapper">
          <select id="categoryFilter" onchange="onFilterChange()">
            <option value="">Alle Kategorien</option>
          </select>
        </div>
      </div>
    </div>

    <!-- DEALS GRID -->
    <div class="deals-grid-container">
      <div class="deals-grid" id="dealsContainer">
        <div class="no-deals">Lade Angebote...</div>
      </div>
    </div>

    <!-- PAGINIERUNG -->
    <div class="pagination-container" id="paginationContainer"></div>
  </main>

  <!-- GLOBALE FUSSZEILE -->
  <div id="global-footer"></div>

  <script src="/components.js"></script>
  <script>
    let allDeals = [];
    let filteredDeals = [];
    let currentShop = 'all';
    const itemsPerPage = 27;
    let currentPage = 1;

    async function loadAllDeals() {
      const container = document.getElementById('dealsContainer');
      container.innerHTML = '<div class="no-deals">Lade aktuelle Angebote...</div>';

      try {
        // Cache Buster: Verhindert, dass Browser oder Cloudflare veraltete Daten cachen
        const cacheBuster = '?v=' + new Date().getTime();
        const [amazonRes, aliRes] = await Promise.allSettled([
          fetch('/deals.json' + cacheBuster),
          fetch('/aliexpress-deals.json' + cacheBuster)
        ]);

        let amazonData = [];
        let aliData = [];

        if (amazonRes.status === 'fulfilled' && amazonRes.value.ok) {
          amazonData = await amazonRes.value.json();
          amazonData = amazonData.map(d => ({ ...d, _shop: 'amazon' }));
        }

        if (aliRes.status === 'fulfilled' && aliRes.value.ok) {
          aliData = await aliRes.value.json();
          aliData = aliData.map(d => ({ ...d, _shop: 'ali' }));
        }

        allDeals = [...amazonData, ...aliData];

        if (allDeals.length === 0) {
          container.innerHTML = '<div class="no-deals">Aktuell sind keine Deals erreichbar.</div>';
          return;
        }

        populateCategorySelect(document.getElementById('categoryFilter'), allDeals);
        onFilterChange();
      } catch (err) {
        console.error("Fehler beim Laden der Deals:", err);
        container.innerHTML = '<div class="no-deals">Fehler beim Laden der Angebote.</div>';
      }
    }

    function setShopFilter(shop) {
      currentShop = shop;
      document.querySelectorAll('.shop-tab-btn').forEach(btn => btn.classList.remove('active'));
      
      if (shop === 'all') document.getElementById('tab-all').classList.add('active');
      if (shop === 'amazon') document.getElementById('tab-amazon').classList.add('active');
      if (shop === 'ali') document.getElementById('tab-ali').classList.add('active');

      onFilterChange();
    }

    function onFilterChange() {
      const searchVal = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const catVal = document.getElementById('categoryFilter').value;

      filteredDeals = allDeals.filter(deal => {
        const matchesShop = (currentShop === 'all') || (deal._shop === currentShop);
        const title = (deal['Produkt-Titel'] || deal['Titel'] || '').toLowerCase();
        const matchesSearch = !searchVal || title.includes(searchVal);
        const category = deal['Kategorie'] || '';
        const matchesCat = !catVal || category.toLowerCase() === catVal.toLowerCase();

        return matchesShop && matchesSearch && matchesCat;
      });

      currentPage = 1;
      renderCurrentPage();
    }

    function renderCurrentPage() {
      const container = document.getElementById('dealsContainer');
      const startIdx = (currentPage - 1) * itemsPerPage;
      const pageItems = filteredDeals.slice(startIdx, startIdx + itemsPerPage);

      if (pageItems.length === 0) {
        container.innerHTML = '<div class="no-deals">Keine passenden Deals gefunden.</div>';
        document.getElementById('paginationContainer').innerHTML = '';
        return;
      }

      container.innerHTML = pageItems.map(dealCardHTML).join('');
      renderPaginationHTML(
        document.getElementById('paginationContainer'),
        filteredDeals.length,
        itemsPerPage,
        currentPage,
        'goToPage'
      );
    }

    function goToPage(page) {
      currentPage = page;
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Start-Initialisierung
    loadAllDeals();
  </script>
</body>
</html>
